services:
  vectordb:
    image: chromadb/chroma:0.5.20
    container_name: re_vectordb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: re_scraper
    env_file: .env
    environment:
      - SCRAPE_MAX_PAGES=${SCRAPE_MAX_PAGES:-5}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      vectordb:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: re_backend
    env_file: .env
    environment:
      - CHROMA_HOST=vectordb
      - CHROMA_PORT=8000
      - DATA_DIR=/app/data
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      vectordb:
        condition: service_healthy
      scraper:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: re_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}

volumes:
  chroma_data:
