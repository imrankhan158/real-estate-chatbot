services:
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: re_scraper
    env_file: .env
    environment:
      - SCRAPE_MAX_PAGES=${SCRAPE_MAX_PAGES:-5}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: re_backend
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-real-estate}
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      scraper:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: re_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
